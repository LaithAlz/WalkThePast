# Walk the Past — Lyra 1.0 single-image static scene config.
# Copy of configs/demo/lyra_static.yaml pointed at freshly generated latents.
out_dir_inference: outputs/walkthepast

# reads assets/demo/static/diffusion_output_generated (see src/models/data/registry.py)
dataset_name: lyra_static_demo_generated

static_view_indices_fixed: ['5', '0', '1', '2', '3', '4']
target_index_subsample: 4
set_manual_time_idx: true

config_path: [configs/training/default.yaml, configs/training/3dgs_res_704_1280_views_121_multi_6_prune.yaml]
ckpt_path: checkpoints/Lyra/lyra_static.pt

# make sure the 3D Gaussians are written out as .ply
save_gaussians: true
